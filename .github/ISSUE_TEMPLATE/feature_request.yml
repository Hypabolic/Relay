name: Feature request
description: Propose a capability, provider, or UX improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Relay stays aligned with [SPEC.md](https://github.com/Hypabolic/Relay/blob/main/SPEC.md)
        and Trajectory for decode/listing. Provider additions should prefer Trajectory
        support first ([provider extensibility](https://github.com/Hypabolic/Relay/blob/main/docs/provider-extensibility.md)).

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - New foreign provider
        - Picker / startup UX
        - Handoff / resume behaviour
        - Transcript search tools
        - Config / roots
        - pi.dev package metadata
        - Documentation
        - CI / release
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you solving? Who hits it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Ideal UX or behaviour. Note Trajectory dependency if any.
      placeholder: |
        e.g. Support Cursor once Trajectory adds a source adapter…
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for similar requests
          required: true
        - label: I checked SPEC.md / provider-extensibility docs when relevant
          required: false
